tion:h2 9.0s linear infinite}@keyframes m3{0%,34.00%{transform:translate(120px,480px);opacity:0;animation-timing-function:ease-in-out}35.50%{opacity:1}44.00%{transform:translate(120px,540px);opacity:1}47.00%,100%{transform:translate(120px,540px);opacity:0}}@keyframes h3{0%,33.00%{opacity:0}35.00%,44.00%{opacity:.9}51.00%,100%{opacity:0}}.m3{animation:m3 9.0s linear infinite}.h3{animation:h3 9.0s linear infinite}@keyframes m4{0%,48.00%{transform:translate(392px,312px);opacity:0;animation-timing-function:ease-in-out}49.50%{opacity:1}58.00%{transform:translate(488px,312px);opacity:1}61.00%,100%{transform:translate(488px,312px);opacity:0}}@keyframes h4{0%,47.00%{opacity:0}49.00%,58.00%{opacity:.9}65.00%,100%{opacity:0}}.m4{animation:m4 9.0s linear infinite}.h4{animation:h4 9.0s linear infinite}@keyframes m5{0%,60.00%{transform:translate(488px,330px);opacity:0;animation-timing-function:ease-in-out}61.50%{opacity:1}68.00%{transform:translate(392px,330px);opacity:1}71.00%,100%{transform:translate(392px,330px);opacity:0}}@keyframes h5{0%,59.00%{opacity:0}61.00%,68.00%{opacity:.9}75.00%,100%{opacity:0}}.m5{animation:m5 9.0s linear infinite}.h5{animation:h5 9.0s linear infinite}@keyframes m6{0%,72.00%{transform:translate(360px,144px);opacity:0;animation-timing-function:ease-in-out}73.50%{opacity:1}84.00%{transform:translate(360px,76px);opacity:1}87.00%,100%{transform:translate(360px,76px);opacity:0}}@keyframes h6{0%,71.00%{opacity:0}73.00%,84.00%{opacity:.9}91.00%,100%{opacity:0}}.m6{animation:m6 9.0s linear infinite}.h6{animation:h6 9.0s linear infinite}@media (prefers-reduced-motion:reduce){.pk,.hl{animation:none;display:none}}</style>
