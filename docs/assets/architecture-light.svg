<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" role="img" aria-labelledby="title desc" lang="en">
<title id="title">How parking-control handles a check-out</title>
<desc id="desc">A client (curl, Swagger UI or any frontend) sends an HTTP request to the REST controllers, which validate it and report errors as RFC 7807 problem details. The domain services apply the parking rules, load and update spots and sessions through Spring Data JPA repositories (optimistic locking and a unique open-plate key prevent double booking), which persist to PostgreSQL 16 with Flyway migrations. On check-out the service asks the pure PriceCalculator for the amount (grace period, first hour, started fractions, daily cap), and the controller returns JSON to the client. The OpenAPI spec and Swagger UI are generated from the controllers; tests run the same schema on H2 in PostgreSQL mode.</desc>
