<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" role="img" aria-labelledby="title desc" lang="pt-BR">
<title id="title">Como o parking-control processa um check-out</title>
<desc id="desc">Um cliente (curl, Swagger UI ou qualquer frontend) envia uma requisição HTTP aos controllers REST, que a validam e devolvem erros no formato RFC 7807. Os serviços de domínio aplicam as regras do estacionamento, leem e atualizam vagas e sessões pelos repositórios Spring Data JPA (lock otimista e chave única de placa aberta impedem reserva dupla), que gravam no PostgreSQL 16 com migrações Flyway. No check-out o serviço pede o valor à função pura PriceCalculator (tolerância, primeira hora, frações iniciadas, teto diário) e o controller devolve JSON ao cliente. A especificação OpenAPI e o Swagger UI são gerados a partir dos controllers; os testes rodam o mesmo schema no H2 em modo PostgreSQL.</desc>
